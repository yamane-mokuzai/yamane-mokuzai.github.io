<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="岐阜県不破郡関ケ原町今須の山根木材です。創業昭和47年、全国から厳選した高品質な木材（今須杉、檜など）の伐採・運搬から、地域の暮らしに寄り添う丁寧なリフォーム・改築まで手掛けています。">
    <meta name="keywords" content="山根木材,関ケ原,今須,今須杉,木材,林業,リフォーム,改築,岐阜県">
    <title>お問い合わせ | 山根木材</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; color: #333333; background-color: #fcfdfc; line-height: 1.8; }
        header {
            width: 100%; padding: 20px 6%; background-color: #ffffff; box-shadow: 0 2px 20px rgba(0, 0, 0, 0.03);
            position: fixed; top: 0; left: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center;
        }
        .logo-container { display: flex; align-items: center; text-decoration: none; color: #333333; }
        .logo-image { height: 55px; width: auto; margin-right: 15px; }
        .company-name { font-size: 24px; font-weight: bold; color: #1e3b29; letter-spacing: 0.15em; }
        .since-year { font-size: 11px; color: #bfa15f; font-weight: bold; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 35px; }
        nav ul li a { text-decoration: none; color: #555555; font-size: 15px; font-weight: 600; }
        nav ul li a:hover { color: #1e3b29; }
        
        main { max-width: 800px; margin: 140px auto 80px; padding: 0 6%; }
        .section-title { font-size: 32px; color: #1e3b29; margin-bottom: 30px; position: relative; padding-bottom: 15px; font-weight: 700; text-align: center; }
        .section-title::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 40px; height: 3px; background-color: #bfa15f; }
        
        .contact-intro { text-align: center; color: #666666; margin-bottom: 40px; }
        .phone-box { text-align: center; background: #f4f7f4; padding: 20px; border-radius: 8px; margin-bottom: 45px; border: 1px dashed #1e3b29; }
        .phone-box p { font-size: 14px; color: #555555; margin-bottom: 5px; }
        .phone-number { font-size: 26px; font-weight: bold; color: #1e3b29; text-decoration: none; }
        
        footer { background-color: #1e3b29; color: #ffffff; text-align: center; padding: 50px 20px; font-size: 14px; }
        @media (max-width: 768px) { header { flex-direction: column; padding: 15px; } nav { margin-top: 15px; } main { margin-top: 180px; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="symplelogo.png" alt="山根木材 ロゴマーク" class="logo-image">
            <div class="logo-text">
                <span class="company-name">山根木材</span>
                <span class="since-year">Since 1971</span>
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="about.html">木材へのこだわり</a></li>
                <li><a href="info.html">会社概要</a></li>
                <li><a href="contact.html" style="color: #1e3b29; border-bottom: 2px solid #bfa15f;">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">お問い合わせ</h2>
 

        <!-- オリジナルデザインの入力フォーム -->
        <!-- 【注意】後ほどFormspreeのURLを発行したら action="https://formspree.io/f/xxxxx" に書き換えます -->
        <form action="https://formspree.io/f/xqerpred" method="POST" style="max-width: 600px; margin: 0 auto; text-align: left; background: #f9fbf9; padding: 30px; border-radius: 8px; border: 1px solid #e2ece2;">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #1e3b29; margin-bottom: 5px;">お名前 <span style="color: red; font-size: 12px;">(必須)</span></label>
                <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 4px; font-size: 15px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #1e3b29; margin-bottom: 5px;">メールアドレス <span style="color: red; font-size: 12px;">(必須)</span></label>
                <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 4px; font-size: 15px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; color: #1e3b29; margin-bottom: 5px;">件名</label>
                <input type="text" name="subject" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 4px; font-size: 15px;">
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: bold; color: #1e3b29; margin-bottom: 5px;">お問い合わせ内容 <span style="color: red; font-size: 12px;">(必須)</span></label>
                <textarea name="message" rows="6" required style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 4px; font-size: 15px; resize: vertical;"></textarea>
            </div>
            <div style="text-align: center;">
                <button type="submit" style="background-color: #1e3b29; color: white; border: none; padding: 12px 40px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; width: 100%; max-width: 250px;">
                    送信する
                </button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 山根木材 All Rights Reserved.</p>
    </footer>
</body>
</html>
